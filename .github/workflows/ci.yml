name: QA

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 0"  # Sundays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONASYNCIODEBUG: "1"

jobs:
  qa-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check bot/ tests/

      - name: Ruff format check
        run: uv run ruff format --check bot/ tests/

      - name: Mypy
        run: uv run mypy --follow-imports=silent bot/

      - name: Bandit
        run: uv run bandit -r bot/ -c pyproject.toml --severity-level medium

      - name: uv audit
        run: uv audit

      - name: Tests with coverage
        run: uv run pytest --cov-fail-under=75

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  dashboard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: cd dashboard && npm ci

      - name: Type check
        run: cd dashboard && npx tsc --noEmit

      - name: Tests
        run: cd dashboard && npx vitest run
