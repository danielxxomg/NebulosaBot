name: Supabase Backup

on:
  schedule:
    # Run weekly at 02:00 UTC on Sunday
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install PostgreSQL 17 client and GPG
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 gnupg

      - name: Preflight check database connection URL
        # Root cause of historical run 36835825347: empty SUPABASE_DB_URL caused pg_dump
        # to fall back to local Unix domain socket (/var/run/postgresql/.s.PGSQL.5432).
        # We fail closed here BEFORE invoking pg_dump using bot.utils.db_guard.validate_db_url.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 -c "
          import os, sys
          from bot.utils.db_guard import validate_db_url

          res = validate_db_url(os.environ.get('SUPABASE_DB_URL'))
          if not res.ok:
              print(f'::error::SUPABASE_DB_URL preflight validation failed: {res.reason}')
              sys.exit(1)
          print(f'Preflight check passed: {res.reason}')
          "

      - name: Dump Supabase DB (pooler)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" -Fc -f dump.pgdump

      - name: Encrypt database dump (GPG symmetric)
        # Symmetrically encrypt the dump using BACKUP_ENCRYPTION_KEY secret (documented TBD).
        # Fails explicitly with clear message if secret is missing rather than silent skip.
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "${BACKUP_KEY// }" ]; then
            echo "::error::BACKUP_ENCRYPTION_KEY secret is not set. Encrypted backup cannot proceed."
            exit 1
          fi
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_KEY" -o dump.pgdump.gpg dump.pgdump
          rm -f dump.pgdump

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-dump-encrypted
          path: dump.pgdump.gpg
          retention-days: 30

      # Alerting note: Workflow failure notifications are delivered via native
      # GitHub Actions workflow-run notifications; no separate webhook secret is configured.
      # Note on freshness/staleness: GitHub Actions `schedule` triggers do not fire when the
      # platform or runner infrastructure is unavailable, so a MISSING run cannot be detected
      # by this workflow itself. Freshness/staleness monitoring requires an EXTERNAL deadline
      # check (or a real alerting integration) that is NOT configured here.
      #
      # Isolated restore acceptance procedure (CI recipe text):
      # To test restoration safely without mutating live systems:
      #   1. Spin up an ephemeral PostgreSQL service container (postgres:15-alpine).
      #   2. Decrypt: gpg --batch --decrypt --passphrase "$BACKUP_KEY" -o restored.pgdump dump.pgdump.gpg
      #   3. Verify table inventory: pg_restore --list restored.pgdump
      #   4. Test restore into ephemeral DB: pg_restore -d "postgres://test:test@localhost:5432/test" restored.pgdump
      #   5. Run sanity queries on ephemeral DB, then tear down container.
