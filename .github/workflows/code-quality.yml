name: Code Quality

# Hygiene spec H-6: every external GitHub Action step is SHA-pinned
# (see actions/checkout, actions/setup-node, actions/setup-python below).
# jscpd budget gate uses the same pinned npx jscpd@4.0.1 + baseline
# via scripts/jscpd_check.py — its failure is blocking (no continue-on-error).

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: jscpd — duplication report (advisory)
        run: |
          npx jscpd@4.0.1 bot/ --threshold 5 --reporters console
          npx jscpd@4.0.1 tests/ --threshold 10 --reporters console

      - name: jscpd — duplication budget gate
        run: python scripts/jscpd_check.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: vulture — dead code report
        continue-on-error: true
        run: |
          pip install vulture==2.14
          vulture bot/ --min-confidence 80

  security-advisory:
    # Supply-chain + secrets scanning. BLOCKING since clean-1.0 S0.12:
    # the full-scan triage completed clean, so continue-on-error is
    # REMOVED — any new finding fails the workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # betterleaks history scan needs full refs

      - name: OSV-Scanner — CVE gate (uv.lock + package-lock.json)
        run: |
          curl -sL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source . --format table

      - name: Betterleaks — secrets (full dir, config-triaged)
        run: |
          curl -sL -o betterleaks.tar.gz https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz
          echo "efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a  betterleaks.tar.gz" | sha256sum -c -
          tar xz -f betterleaks.tar.gz betterleaks
          ./betterleaks dir . --redact --no-banner

      # ── clean-1.0 S0.12: this job is BLOCKING (no continue-on-error) ──
      # History scan (expensive; schedule weekly, not per-PR):
      #   ./betterleaks git . --redact --log-opts="--all"

  dashboard-lint-advisory:
    # Oxlint (via Ultracite core preset) over dashboard/. Advisory phase:
    # baseline 288 findings on 2026-08-23 (mostly style: sort-keys, func-style,
    # unicorn). Triage → fix or rule-tune in the dedicated dashboard-QA SDD,
    # then flip continue-on-error to false.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dashboard deps (npm ci)
        working-directory: dashboard
        run: npm ci

      - name: Oxlint (Ultracite core) — advisory
        working-directory: dashboard
        run: npm run lint:ox

      - name: ESLint (existing flat config) — advisory parity check
        continue-on-error: true
        working-directory: dashboard
        run: npm run lint

      # ── Commented out: NOT adopted yet — revisit in dashboard-QA SDD ──
      # Knip — unused files/exports/deps (needs knip.json + baseline):
      #   npx knip --strict
      # Next typegen + build as final framework gate (blocking candidate):
      #   npx next typegen && npx next build
      # Oxlint type-aware via tsgolint (experimental upstream):
      #   see oxc-project/tsgolint before enabling.
      # Blocking variant: remove `continue-on-error: true` from this job.
