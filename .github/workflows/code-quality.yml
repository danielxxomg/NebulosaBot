name: Code Quality (Report Only)

# Hygiene spec H-6: every external GitHub Action step is SHA-pinned
# (see actions/checkout, actions/setup-node, actions/setup-python below).
# Third-party *report-only* tools (jscpd, vulture) run via npx/pip in a run
# block with continue-on-error: true — they emit duplication and dead-code
# reports but never block the PR. npx/pip resolve from the package registry
# by version, not by a git-object SHA the way Actions pin their steps; they
# cannot be SHA-pinned inline. To stay closest to H-6 these tools are
# version-pinned (not latest) and the jobs are non-blocking. Moving them to
# a SHA-verified lockfile (npm ci with package-lock resolved SHAs; pip install
# --require-hashes) is tracked as a follow-up; the report-only posture keeps
# this deviation safe.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: jscpd — duplication report
        continue-on-error: true
        run: |
          npx jscpd@4.0.1 bot/ --threshold 5 --reporters console
          npx jscpd@4.0.1 tests/ --threshold 10 --reporters console

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: vulture — dead code report
        continue-on-error: true
        run: |
          pip install vulture==2.14
          vulture bot/ --min-confidence 80
