name: Code Quality (Report Only)

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: jscpd — duplication report
        continue-on-error: true
        run: |
          npx jscpd bot/ --threshold 5 --reporters console
          npx jscpd tests/ --threshold 10 --reporters console

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: vulture — dead code report
        continue-on-error: true
        run: |
          pip install vulture
          vulture bot/ --min-confidence 80
