# Supabase CLI — tracked migration linkage for NebulosaBot.
# S5 production-live-close: links ../migrations via symlink for `supabase migration up --linked`.
# Ledger reconciliation: supabase migration repair --status applied for 3 desync names (016/017 + 2 realtime pubs).
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

