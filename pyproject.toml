[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nebulosabot"
version = "0.1.0"
description = "Discord bot with moderation, economy, and ticket system — powered by Supabase"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nebulosa Team"},
]
requires-python = ">=3.11"
keywords = ["discord", "bot", "supabase", "moderation", "tickets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Discord.py",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "discord.py>=2.3",
    "pillow>=11.0",
    "supabase>=2.0",
    "python-dotenv>=1.0",
    "PyJWT[crypto]>=2.0",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "ruff==0.15.20",
    "ty==0.0.18",
]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Repository = "https://github.com/gentle-programming/NebulosaBot"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=bot --cov-fail-under=75 --randomly-seed=42"
markers = [
    "live: credential-gated live Supabase read-only verifier (requires LIVE_SUPABASE=1 + SUPABASE_URL or --run-live)",
]
filterwarnings = [
    # Lock zero-warning discipline — any unhandled warning becomes a test failure.
    # Listed FIRST so it ends up LAST in Python's internal filter chain (filters
    # are prepended, first match wins) — explicit ignore entries below take priority.
    "error",
    # discord.py 2.x triggers this under PYTHONASYNCIODEBUG=1
    "ignore:.*coroutine.*is not a coroutine:DeprecationWarning",
    # pytest-asyncio internal deprecation on Python 3.14
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
    # hypothesis deadline flake on slow CI runners (handled via @settings(deadline=None))
    "ignore::hypothesis.errors.HypothesisDeprecationWarning",
    # discord.ui.TextInput.label deprecated in favor of discord.ui.Label (full migration deferred)
    "ignore::DeprecationWarning:discord.ui",
    # discord.py imports stdlib audioop (deprecated on 3.11/3.12, removed on 3.13+)
    "ignore:.*audioop.*:DeprecationWarning",
    # Pillow/tempfile cleanup noise under PYTHONASYNCIODEBUG on 3.14 CI image tests
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.setuptools.package-data]
bot = ["*.py"]

# --- QA tooling (rama-c-qa-tooling PR1) ---

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "S",    # bandit/security
    "C4",   # comprehensions
    "C90",  # mccabe complexity
    "RET",  # return
    "T20",  # print
    "ARG",  # unused arguments
    "DTZ",  # datetime timezone
    "EM",   # errmsg
    "T10",  # debugger
    "TRY",  # tryceratops
    "RSE",  # raise
    "FLY",  # flynt
    "PERF", # perflint
    "FURB", # refurb
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# tests/ — allow assert, print, unused args in test files
"tests/**/*.py" = ["S101", "S105", "S106", "ARG", "T20", "TRY003", "EM101", "FURB110", "RET504", "RET505", "PERF401", "SIM108"]
# PR1 broad debt allowances — rules are ENABLED but violations suppressed.
# PR2-PR5 will progressively remove these as debt is cleared.
"bot/**/*.py" = ["S", "C4", "C90", "T20", "ARG", "DTZ", "EM", "T10", "TRY003", "TRY004", "TRY300", "TRY301", "FLY", "PERF", "FURB", "RUF059", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
possibly-unresolved-reference = "warn"
unused-ignore-comment = "error"

[[tool.ty.overrides]]
include = ["bot/cogs/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "warn"
possibly-missing-attribute = "warn"
unresolved-attribute = "warn"
invalid-argument-type = "warn"
invalid-assignment = "warn"
not-subscriptable = "warn"
unused-ignore-comment = "warn"

[tool.bandit]
exclude_dirs = ["tests", "dashboard"]
