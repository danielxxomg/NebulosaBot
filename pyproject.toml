[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nebulosabot"
version = "0.9.0"
description = "Discord bot with moderation, economy, and ticket system — powered by Supabase"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nebulosa Team"},
]
requires-python = ">=3.11"
keywords = ["discord", "bot", "supabase", "moderation", "tickets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Discord.py",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "discord.py>=2.3",
    "pillow>=11.0",
    "supabase>=2.0",
    "python-dotenv>=1.0",
    "PyJWT[crypto]>=2.0",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "ruff==0.15.20",
    "ty==0.0.18",
    "tach==0.35.0",
    "vulture==2.14",
]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Repository = "https://github.com/gentle-programming/NebulosaBot"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=bot --cov-fail-under=75 --randomly-seed=42"
markers = [
    "live: credential-gated live Supabase read-only verifier (requires LIVE_SUPABASE=1 + SUPABASE_URL or --run-live)",
]
filterwarnings = [
    # Lock zero-warning discipline — any unhandled warning becomes a test failure.
    # Listed FIRST so it ends up LAST in Python's internal filter chain (filters
    # are prepended, first match wins) — explicit ignore entries below take priority.
    "error",
    # discord.py 2.x triggers this under PYTHONASYNCIODEBUG=1
    "ignore:.*coroutine.*is not a coroutine:DeprecationWarning",
    # pytest-asyncio internal deprecation on Python 3.14
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
    # hypothesis deadline flake on slow CI runners (handled via @settings(deadline=None))
    "ignore::hypothesis.errors.HypothesisDeprecationWarning",
    # discord.ui.TextInput.label deprecated in favor of discord.ui.Label (full migration deferred)
    "ignore::DeprecationWarning:discord.ui",
    # discord.py imports stdlib audioop (deprecated on 3.11/3.12, removed on 3.13+)
    "ignore:.*audioop.*:DeprecationWarning",
    # Pillow/tempfile cleanup noise under PYTHONASYNCIODEBUG on 3.14 CI image tests
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # discord.utils.escape_markdown calls re.sub with positional count (discord.py internal)
    "ignore::DeprecationWarning:re",
    "ignore:.*count.*is passed as positional argument:DeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.setuptools.package-data]
bot = ["*.py"]

# --- QA tooling (rama-c-qa-tooling PR1) ---

[tool.ruff]
target-version = "py311"
line-length = 120
preview = true
required-version = "0.15.20"

[tool.ruff.lint]
explicit-preview-rules = true
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "S",    # bandit/security
    "C4",   # comprehensions
    "C90",  # mccabe complexity
    "RET",  # return
    "T20",  # print
    "ARG",  # unused arguments
    "DTZ",  # datetime timezone
    "EM",   # errmsg
    "T10",  # debugger
    "TRY",  # tryceratops
    "RSE",  # raise
    "FLY",  # flynt
    "PERF", # perflint
    "FURB", # refurb
    "ANN",  # flake8-annotations — ty alignment (preview, explicit)
    "PYI",  # flake8-pyi — ty alignment (preview, explicit)
    "PGH003",  # pygrep-hooks blanket-type-ignore — ty alignment (preview, explicit)
    "ASYNC",  # flake8-async
    "BLE",  # flake8-blind-except
    "G",    # flake8-logging
    "A",    # flake8-builtins
    "PT011",  # flake8-pytest-style single rule (PT rest deferred)
    # PLC0415 requested import not top-level — advisory only, NEVER in select (PLR/PTH/SLF deferred)
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# tests/ — allow assert, print, unused args in test files
"tests/test_pr1_uv_foundation.py" = ["S101", "S105", "S106", "ARG", "T20", "TRY003", "EM101", "FURB110", "RET504", "RET505", "PERF401", "SIM108", "E741", "S603", "S607"]
"tests/test_pr2_ty_replaces_mypy.py" = ["S101", "S105", "S106", "ARG", "T20", "TRY003", "EM101", "FURB110", "RET504", "RET505", "PERF401", "SIM108", "E741", "S603", "S607", "E501"]
"tests/test_pr4a_ruff_mechanical.py" = ["S101", "S105", "S106", "ARG", "T20", "TRY003", "EM101", "FURB110", "RET504", "RET505", "PERF401", "SIM108", "S603", "S607"]
"tests/test_pr4b_ruff_security.py" = ["S101", "S105", "S106", "ARG", "T20", "TRY003", "EM101", "FURB110", "RET504", "RET505", "PERF401", "SIM108", "S603", "S607"]
"tests/test_pr5_security_bandit_zizmor.py" = ["S101", "S105", "S106", "ARG", "T20", "TRY003", "TRY004", "EM101", "EM102", "TRY300", "TRY301", "FURB110", "FURB113", "RUF059", "RET504", "RET505", "PERF401", "PERF203", "SIM105", "SIM108", "S603", "S607", "E501", "TRY400", "TRY401", "RUF100"]
"tests/test_pr6_tach_boundaries.py" = ["S101", "S105", "S106", "ARG", "T20", "TRY003", "EM101", "FURB110", "RET504", "RET505", "PERF401", "SIM108", "S603", "S607", "FURB101", "E501"]
"tests/test_welcome_foundation_pr1_*.py" = ["S101", "S105", "S106", "ARG", "T20", "TRY003", "EM101", "FURB110", "RET504", "RET505", "PERF401", "SIM108", "S603", "S607", "N802", "E741"]
"tests/test_pr3_prek_replaces_precommit.py" = ["S101", "S105", "S106", "ARG", "T20", "TRY003", "EM101", "FURB110", "RET504", "RET505", "PERF401", "SIM108", "S603"]
"tests/**/*.py" = ["S101", "S105", "S106", "ARG", "T20", "TRY003", "EM101", "FURB110", "RET504", "RET505", "PERF401", "SIM108", "ANN", "PYI", "PGH", "RUF052", "RUF029", "RUF069", "RUF050", "RUF100", "S404", "FURB101", "FURB113", "FURB142", "S603", "E501", "PYI034"]
"tests/test_bot_probe.py" = ["ASYNC240"]
"tests/test_pr3_ocio_service_red.py" = ["ASYNC240"]
"tests/test_remediation_final_partials.py" = ["ASYNC240"]
"tests/test_s2d1_context_typing_chars.py" = ["ASYNC240"]
"tests/test_schema_inventory_verifier.py" = ["ASYNC240"]
"scripts/**/*.py" = ["S404", "RUF052", "FURB101"]  # out of scope for PR4c (preview collateral)
# PR4c: full quality suppression removal — bot/** now lint-clean (40 findings fixed via real code changes + narrow noqa with reasons).
# Per-file broad suppression for bot/** removed; remaining narrow noqa per-site retained.
"bot/services/ocio_service.py" = ["TRY301"]
"bot/**/*.py" = ["ANN", "RUF052", "RUF029", "RUF069", "RUF050", "RUF100"]  # preview debt deferred: dummy-var/unused-async/float-eq/unused-noqa (0 ANN/PYI/PGH003 in bot/; preview=true per 4c.4)

